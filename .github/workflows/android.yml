name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    # Pinned on purpose: an unpinned build is not a build you can reproduce. Bump this deliberately.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # AGP 9 and the Kotlin 2.4 toolchain both target JDK 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # This action only has to fetch cmdline-tools and export ANDROID_HOME; the next step installs
      # exactly what the build needs.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Without these the build still succeeds: the release APK then falls back to the runner's
      # debug key, which keeps the artifact installable instead of unsigned.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::KEYSTORE_BASE64 is not set, signing with the debug key."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nekonote-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/nekonote-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: List build outputs
        run: ls -l app/build/outputs/apk/release/

      # A release asset called `app-release.apk` tells the user nothing; the ref does.
      - name: Name the APK after the ref
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            cp "$apk" "dist/NekoNote-${GITHUB_REF_NAME}.apk"
          done
          ls -l dist/

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: NekoNote-release-apk
          path: dist/*.apk
          if-no-files-found: error

      # The R8 mapping, so an obfuscated stack trace can be turned back into real names.
      - name: Upload the R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: NekoNote-release-apk
          path: apk

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: apk/*.apk
          generate_release_notes: true
          draft: false
